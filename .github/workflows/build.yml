name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Build toolchain image
        run: docker compose build test

      - name: Unit tests
        run: docker compose run --rm test

      - name: Package
        run: docker compose run --rm package

      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/^project(obdlink_j2534 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: obdlink-stn-j2534-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.zip.sha256

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already released"
            exit 0
          fi
          gh release create "$TAG" dist/*.zip dist/*.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "OBDLink STN J2534 $TAG" \
            --prerelease \
            --generate-notes
